services:
  - type: web
    name: crash-club
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRASH_CLUB_BOT_TARGET
        value: "3"
      - key: CRASH_CLUB_TICK_RATE
        value: "12"
      - key: CRASH_CLUB_SNAPSHOT_RATE
        value: "6"
